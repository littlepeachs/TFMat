_target_: diffcsp.pl_modules.flow_imf.CSPFlowIMF
time_dim: 256
latent_dim: 0
cost_type: 1.
cost_coord: 1.
cost_lattice: 1.
max_neighbors: 20  # maximum number of neighbors for OTF graph bulding in decoder
radius: 7.  # maximum search radius for OTF graph building in decoder
timesteps: 1000

# iMF-specific hyperparameters
norm_p: 1.0          # adaptive weighting power
norm_eps: 0.01       # adaptive weighting epsilon
data_proportion: 0.5 # flow matching vs diffusion split

defaults:
  - decoder: cspnet_imf
  - beta_scheduler: cosine
  - sigma_scheduler: wrapped
  - conditions: default
  - _self_

lattice_polar: true
lattice_polar_sigma: 0.1
P_mean: -0.4
P_std: 1.0
loss_u_weight: 1.0
loss_v_weight: 1.0
decoder:
  pred_type: false
  smooth: ${model.decoder.pred_type}
  lattice_dim: 6
  ip: false
